name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @codexsun/blog
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Check out the release
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check release version
        run: npm run check:versions && node tools/check-release-tag.mjs

      - name: Check types and host contract
        run: npm run typecheck && npm run smoke:host-contract

      - name: Preview package contents
        run: npm pack --dry-run

      - name: Check npm registry
        id: registry
        shell: bash
        run: |
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        if: steps.registry.outputs.published != 'true'
        run: npm publish

      - name: Confirm existing package
        if: steps.registry.outputs.published == 'true'
        run: echo "This package version already exists on npm."
