name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @codexsun/blog
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Check out the release
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check release version
        run: npm run check:versions && node tools/check-release-tag.mjs

      - name: Check types and host contract
        run: npm run typecheck && npm run smoke:host-contract

      - name: Preview package contents
        run: npm pack --dry-run

      - name: Publish package
        run: npm publish
